name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push makes an in-flight run pointless, except on main where every
# commit should produce its image.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # Builds the server, checks the unit and import parsing, then boots the
      # API against a throwaway database, a fake AI harness and a fake
      # GlitchTip, and walks the whole flow.
      - run: npm test

      # The client isn't covered by the API test, so prove it still bundles.
      - run: npm run build -w client

  publish:
    name: Publish image
    needs: test
    # Pull requests from forks can't write packages, and an unmerged branch
    # shouldn't publish anyway.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - id: stamp
        run: echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          # Proxmox hosts are x86; add linux/arm64 here if that ever changes,
          # bearing in mind it builds under emulation and is much slower.
          platforms: linux/amd64
          push: true
          build-args: |
            GROCER_VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
            GROCER_BUILT_AT=${{ steps.stamp.outputs.built_at }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the published image
        run: |
          # No AI and no GlitchTip here; the app must still start, answer its
          # health check and serve the client.
          docker run -d --name smoke -p 18080:8080 ${{ env.IMAGE }}:sha-${{ github.sha }}
          for i in $(seq 1 20); do
            if curl -fsS localhost:18080/api/health > /dev/null; then
              curl -fsS localhost:18080/ | grep -q '<div id="root">'
              curl -fsS localhost:18080/api/meta | grep -q '"enabled":false'
              docker rm -f smoke
              exit 0
            fi
            sleep 1
          done
          echo "image did not become healthy"
          docker logs smoke
          exit 1

      - name: Summarise
        run: |
          {
            echo "### Image published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Redeploy the Portainer stack (Pull and redeploy), or by hand:"
            echo
            echo '```bash'
            echo "docker compose pull && docker compose up -d"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
